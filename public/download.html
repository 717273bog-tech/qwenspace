<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Скачать приложение</title>
<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#0f0c29,#302b63,#24243e);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #eee;
    margin: 0;
}
.card {
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px;
    padding: 40px;
    text-align: center;
    max-width: 400px;
}
.logo { font-size: 80px; margin-bottom: 20px; }
h1 { font-size: 24px; margin-bottom: 10px; }
p { color: #aaa; margin-bottom: 30px; }
.download-btn {
    display: inline-block;
    background: linear-gradient(45deg,#ff6b6b,#feca57);
    color: #000;
    padding: 15px 40px;
    border-radius: 30px;
    font-weight: bold;
    font-size: 16px;
    text-decoration: none;
    transition: transform 0.2s;
}
.download-btn:hover { transform: scale(1.05); }
.note { font-size: 12px; color: #666; margin-top: 20px; }
</style>
</head>
<body>
<div class="card">
    <div class="logo">🌐</div>
    <h1>Моя Соцсеть</h1>
    <p>Скачай приложение для Android</p>
    <a href="/downloads/app.apk" download="app.apk" class="download-btn">
        ⬇️ Скачать APK
    </a>
    <div class="note">
        После скачивания разреши установку из неизвестных источников
    </div>
</div>
</body>
</html>
